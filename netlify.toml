# netlify.toml — ROOT of repo (build configuration)
# This tells Netlify HOW to build the site.
# The 404 redirect rules live in dist/netlify.toml, written by build_site.js.

[build]
  command   = "node build_site.js"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "18"

# Redirect rules (incl. the /join vanity link) are emitted into dist/ by
# build_site.js — both dist/netlify.toml and dist/_redirects — so /join sits
# in the same file as the catch-all, ahead of it.
